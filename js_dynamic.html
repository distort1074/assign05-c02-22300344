<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript DOM Practice</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 48px 20px;
            background: #f3f5fa;
            color: #25304a;
            font-family: "Malgun Gothic", sans-serif;
        }
        main {
            max-width: 560px;
            margin: auto;
            padding: 28px;
            background: white;
            border: 1px solid #dce2ed;
            border-radius: 12px;
        }
        h1 { margin-top: 0; font-size: 25px; }
        p { color: #59647a; line-height: 1.6; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        .input-row { display: flex; gap: 8px; }
        input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #aeb9cd;
            border-radius: 6px;
            font: inherit;
        }
        button {
            padding: 10px 16px;
            border: 0;
            border-radius: 6px;
            background: #354fc4;
            color: white;
            font: inherit;
            cursor: pointer;
        }
        button:hover { background: #263c9c; }
        input:focus-visible, button:focus-visible {
            outline: 3px solid #8fa5f2;
            outline-offset: 3px;
        }
        ul { margin: 24px 0 0; padding: 0; list-style: none; }
        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            padding: 12px 0;
            border-bottom: 1px solid #e3e7ef;
        }
        li span { min-width: 0; overflow-wrap: anywhere; }
        li button { flex-shrink: 0; background: #a73745; }
        li button:hover { background: #812834; }
        #message { min-height: 24px; margin-bottom: 0; font-size: 14px; }
    </style>
</head>
<body>
    <main>
        <h1>JavaScript DOM Practice</h1>
        <p>단어를 입력해 목록에 추가하고 삭제해 보세요.</p>

        <form id="item-form">
            <label for="item-input">추가할 내용</label>
            <div class="input-row">
                <input id="item-input" type="text" placeholder="예: apple" maxlength="100" required>
                <button type="submit">추가</button>
            </div>
        </form>

        <p id="message" role="status">아직 추가한 항목이 없습니다.</p>
        <ul id="item-list" aria-label="입력한 항목 목록"></ul>
    </main>

    <script>
        const form = document.getElementById('item-form');
        const input = document.getElementById('item-input');
        const list = document.getElementById('item-list');
        const message = document.getElementById('message');

        form.addEventListener('submit', function (event) {
            // 폼 제출로 페이지가 새로고침되는 것을 막습니다.
            event.preventDefault();
            const text = input.value.trim();

            if (text === '') {
                message.textContent = '공백을 제외한 내용을 입력하세요.';
                input.focus();
                return;
            }

            const item = document.createElement('li');
            const content = document.createElement('span');
            content.textContent = text;

            const deleteButton = document.createElement('button');
            deleteButton.type = 'button';
            deleteButton.textContent = '삭제';
            deleteButton.setAttribute('aria-label', text + ' 삭제');
            deleteButton.addEventListener('click', function () {
                item.remove();
                message.textContent = '항목을 삭제했습니다. 남은 항목: ' + list.children.length + '개';
                input.focus();
            });

            item.appendChild(content);
            item.appendChild(deleteButton);
            list.appendChild(item);

            input.value = '';
            input.focus();
            message.textContent = '항목을 추가했습니다. 전체 항목: ' + list.children.length + '개';
        });
    </script>
</body>
</html>
